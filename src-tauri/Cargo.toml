[package]
name = "push-wp"
version = "0.3.2"
description = "将本地 Markdown 发布到 WordPress（push-wp：Tauri + Rust 实现的发布工具）"
authors = ["zhang"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.77"

[lib]
name = "push_wp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
comrak = { version = "0.39", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
quick-xml = "0.37"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
markup5ever_rcdom = "0.39.0"
html5ever = "0.39.0"
tendril = "0.5.1"
semver = "1.0.28"
sha2 = "0.10.9"
zip = { version = "4.2.0", default-features = false, features = ["deflate"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
