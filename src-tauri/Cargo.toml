[package]
name = "push-wp"
version = "0.3.6"
description = "将本地 Markdown 发布到 WordPress（push-wp：Tauri + Rust 实现的发布工具）"
authors = ["zhang"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.77"

[lib]
name = "push_wp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
portable-kit.workspace = true
serde.workspace = true
serde_json.workspace = true
comrak = { version = "0.39", default-features = false }
reqwest = { workspace = true, features = ["blocking"] }
quick-xml = "0.37"
base64 = "0.22"
chrono.workspace = true
thiserror = "2"
markup5ever_rcdom = "0.39.0"
html5ever = "0.39.0"
tendril = "0.5.1"
